name: Build and deploy FreeTrustDocs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: freetrustdocs-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm exec astro build

      - name: Guard - dist/_worker.js would disable Pages Functions
        run: |
          if [ -f dist/_worker.js ]; then
            echo "::error::dist/_worker.js present — Cloudflare Pages switches to advanced mode and silently ignores functions/ (FTD-002 incident 2026-10-08: /api/report-error 404 for 9 days). Delete public/_worker.js and move its logic into functions/."
            exit 1
          fi
          echo "guard ok: no _worker.js, functions/ routing active"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=freetrustdocs --branch=main
