<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Subtle paper grain texture using feTurbulence -->
  <!-- Reads as laid paper quality, not as a graphic pattern -->
  <filter id="paper-grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.545  0 0 0 0 0.412  0 0 0 0 0.078  0 0 0 0.04 0"/>
  </filter>
  <rect width="200" height="200" filter="url(#paper-grain)"/>
</svg>