<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <!-- Linen paper texture: woven cross-hatch pattern evoking professional legal paper -->
  <defs>
    <pattern id="linen-weave" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <!-- Horizontal threads -->
      <line x1="0" y1="1" x2="6" y2="1" stroke="#8b6914" stroke-width="0.4" opacity="0.35"/>
      <line x1="0" y1="4" x2="6" y2="4" stroke="#8b6914" stroke-width="0.3" opacity="0.20"/>
      <!-- Vertical threads (woven over/under effect via opacity) -->
      <line x1="1" y1="0" x2="1" y2="6" stroke="#8b6914" stroke-width="0.4" opacity="0.35"/>
      <line x1="4" y1="0" x2="4" y2="6" stroke="#8b6914" stroke-width="0.3" opacity="0.20"/>
    </pattern>
    <filter id="soften">
      <feGaussianBlur stdDeviation="0.3"/>
    </filter>
  </defs>
  <rect width="120" height="120" fill="url(#linen-weave)" filter="url(#soften)"/>
</svg>