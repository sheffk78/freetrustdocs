      <line x1="0" y1="120" x2="240" y2="120" stroke="#b88a1f" stroke-width="0.5" opacity="0.08"/>
      <line x1="0" y1="0" x2="0" y2="240" stroke="#b88a1f" stroke-width="0.5" opacity="0.12"/>
